name: E2E tests
on: pull_request

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest-low
    outputs:
      php-min: ${{ steps.versions.outputs.php-min }}
      php-max: ${{ steps.versions.outputs.php-max }}
      branches-min: ${{ steps.versions.outputs.branches-min }}
      branches-max: ${{ steps.versions.outputs.branches-max }}
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get version matrix
        id: versions
        uses: icewind1991/nextcloud-version-matrix@71959de73c244b11ecbf4503b87c41d65b0f64ae # v1.3.4

  frontend-e2e-tests:
    runs-on: ubuntu-latest
    name: Front-end E2E tests (NC ${{ matrix.server-version }}, PHP ${{ matrix.php-version }})
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include:
          - server-version: ${{ needs.matrix.outputs.branches-min }}
            php-version: ${{ needs.matrix.outputs.php-min }}
          - server-version: ${{ needs.matrix.outputs.branches-max }}
            php-version: ${{ needs.matrix.outputs.php-max }}
    steps:
      - name: Set up Nextcloud env
        uses: ChristophWurst/setup-nextcloud@14cf58de73855aa30212721e8177ca45626e4477 # v0.4.2
        with:
          nextcloud-version: ${{ matrix.server-version }}
          php-version: ${{ matrix.php-version }}
          install: true
      - name: Configure Nextcloud for testing
        run: |
          php -f nextcloud/occ config:system:set debug --type=bool --value=true
          php -f nextcloud/occ config:system:set overwriteprotocol --value=https
          php -f nextcloud/occ config:system:set overwritehost --value=localhost
          php -f nextcloud/occ config:system:set overwrite.cli.url --value=https://localhost
      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: nextcloud/apps/calendar
      - name: Read package.json node and npm engines version
        uses: skjnldsv/read-package-engines-version-actions@06d6db44aa62f4609ba070f556ec24bc99fb85cb # v4
        id: package-engines-versions
        with:
          fallbackNode: '^24'
          fallbackNpm: '^11'
          path: nextcloud/apps/calendar
      - name: Set up node 24.15.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Set up npm ${{ steps.package-engines-versions.outputs.npmVersion }}
        run: npm i -g 'npm@${{ steps.package-engines-versions.outputs.npmVersion }}'
      - name: Install php dependencies
        working-directory: nextcloud/apps/calendar
        run: composer install
      - name: Install the app
        run: php -f nextcloud/occ app:enable calendar
      - name: Install the E2E test apps
        run: |
          cp -r nextcloud/apps/calendar/tests/apps/event_editor_extension nextcloud/apps/event_editor_extension
          php -f nextcloud/occ app:enable event_editor_extension
      - name: Install npm dependencies
        working-directory: nextcloud/apps/calendar
        run: npm ci
      - name: Build frontend
        working-directory: nextcloud/apps/calendar
        run: npm run build
      - name: Install stunnel (tiny https proxy)
        run: sudo apt-get update && sudo apt-get install -y stunnel
      - name: Start php server and https proxy
        working-directory: nextcloud
        run: |
          openssl req -new -x509 -days 365 -nodes -subj "/C=US/ST=Denial/L=Springfield/O=Dis/CN=localhost" -out stunnel.pem -keyout stunnel.pem
          php -S 127.0.0.1:8080 &
          sudo stunnel3 -p stunnel.pem -d 443 -r 8080
      - name: Test https access
        run: curl --insecure -Li https://localhost
      - name: Install Playwright browsers
        working-directory: nextcloud/apps/calendar
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: nextcloud/apps/calendar
        run: DEBUG=pw:api npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: playwright-report-${{ github.event.number }}-nc${{ matrix.server-version }}-php${{ matrix.php-version }}-node${{ steps.package-engines-versions.outputs.nodeVersion }}
          path: nextcloud/apps/calendar/playwright-report/
          retention-days: 14
      - name: Print server logs
        if: always()
        run: cat nextcloud/data/nextcloud.log*
    env:
      CI: true

  summary:
    runs-on: ubuntu-latest-low
    needs: frontend-e2e-tests

    if: always()

    # Keep the old job name so the existing required status check keeps working
    name: Front-end E2E tests

    steps:
      - name: Summary status
        run: if ${{ needs.frontend-e2e-tests.result != 'success' }}; then exit 1; fi
